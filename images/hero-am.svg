<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Abhishek Maurya monogram">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.12"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffbd39" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffbd39" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#dots)"/>
  <circle cx="400" cy="400" r="330" fill="url(#glow)"/>
  <circle cx="400" cy="400" r="250" fill="none" stroke="#ffbd39" stroke-width="3"/>
  <circle cx="400" cy="400" r="290" fill="none" stroke="#ffbd39" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 14"/>
  <!-- small data-chart motif -->
  <g fill="#ffbd39">
    <rect x="590" y="160" width="14" height="40" rx="3" fill-opacity="0.45"/>
    <rect x="612" y="140" width="14" height="60" rx="3" fill-opacity="0.65"/>
    <rect x="634" y="115" width="14" height="85" rx="3"/>
  </g>
  <polyline points="140,640 190,600 235,615 290,560" fill="none" stroke="#ffbd39" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ffbd39"><circle cx="140" cy="640" r="5"/><circle cx="190" cy="600" r="5"/><circle cx="235" cy="615" r="5"/><circle cx="290" cy="560" r="5"/></g>
  <text x="400" y="400" text-anchor="middle" dominant-baseline="central" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="210" font-weight="800" fill="#ffffff" letter-spacing="-6">A<tspan fill="#ffbd39">M</tspan></text>
</svg>
